<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://openlayers.org/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BẢN ĐỒ NHÀ HÀNG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="popup" class="ol-popup">
      <a href="#" id="popup-closer" class="ol-popup-closer"><i class="fa-solid fa-xmark"></i></a>
      <div id="popup-content"></div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success px-4">
      <a class="navbar-brand" href="#">Trang chủ</a>
      <ul class="navbar-nav ms-auto d-flex flex-row gap-3">
        <li class="nav-item"><a class="nav-link text-white" href="users.html">Quản lý người dùng</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="nhahang.html">Quản lý nhà hàng</a></li>
        <li class="nav-item"><a class="nav-link text-white bg-danger px-3 rounded" href="#" id="logout-btn">Đăng xuất</a></li>
      </ul>
    </nav>

    <div class="container">
      <div class="topbar">
        <div class="logo">
          <h2>HÀ NỘI - NHÀ HÀNG</h2>
        </div>

        <div class="search-filter">
          <div class="search">
            <input type="text" id="searchInput" name="search" placeholder="Nhập tên nhà hàng...">
            <label for="search">
              <i class="fas fa-search"></i></label>
          </div>

          <select id="filter-time">
            <option value="">Giờ hoạt động</option>
            <option value="morning">Buổi sáng (8h - 12h)</option>
            <option value="afternoon">Buổi trưa (12h - 17h)</option>
            <option value="evening">Buổi chiều tối (17h - 23h)</option>
            <option value="late">Đêm khuya (sau 23h)</option>
          </select>

          <select id="filter-area">
            <option value="">Diện tích</option>
            <option value="1">50 - 200</option>
            <option value="2">201 - 400</option>
            <option value="3">401 - 600</option>
            <option value="4">601 - 800</option>
            <option value="5">> 801 m²</option>
          </select>

          <select id="filter-price">
            <option value="">Mức giá </option>
            <option value="1">50k - 200k</option>
            <option value="2">201k - 400k</option>
            <option value="3">401k - 600k</option>
            <option value="4">> 600k</option>
          </select>

          <select id="filter-rating">
            <option value="">Đánh giá</option>
            <option value="1">1 ⭐</option>
            <option value="2">2 ⭐</option>
            <option value="3">3 ⭐</option>
            <option value="4">4 ⭐</option>
            <option value="5">5 ⭐</option>
          </select>

          <select id="filter-radius">
            <option value="">Bán kính</option>
            <option value="0.2">Dưới 200m</option>
            <option value="0.5">Dưới 500m</option>
            <option value="1">Dưới 1km</option>
            <option value="2">Dưới 2km</option> 
            <option value="5">Dưới 5km</option> 
            <option value="6">Dưới 6km</option> 
          </select>

          <button id="apply-filter">Lọc</button>
        </div>

        <div class="location-button">
          <button id="my-location-btn">Vị trí của tôi</button>
          <button id="nearest-btn">Nhà hàng gần nhất</button>
        </div>

        <div class="user">
          <img id="avatar-img" src="" alt="avatar">
        </div>
      </div>

      <div class="main">
        <div id="map" class="map"></div>
        <div id="suggest-box"><ul id="suggestions" class="suggestion-box"></ul></div>
        <button id="suggest-btn" class="map-button">Danh sách nhà hàng</button>
      </div>
    </div>

    <script>
      const role = localStorage.getItem('role');
      /*thay đổi avata người dùng và quản trị viên*/
      const avatar = document.getElementById('avatar-img');
        if (role === 'admin') {
          avatar.src = 'images/user.png';
        } else {
          avatar.src = 'images/logo_hanoi.png';
        }
      /* người dùng và quản trị viên*/
      if (role !== 'admin') {
        const userLink = document.getElementById('userLink');
        const restLink = document.getElementById('restLink');
        if (userLink) userLink.style.display = 'none';
        if (restLink) restLink.style.display = 'none';
      }
    </script>
    <div id="list-container" style="display: none; position: fixed; top: 150px; right: 10px; width: 280px; max-height: 400px; overflow-y: auto; background: #fff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); padding: 12px; z-index: 1500;">
      <h5>📋 Danh sách nhà hàng </h5>
      <ul id="list-results" style="list-style: none; padding-left: 0;"></ul>
    </div>
    <div id="direction-box" style="position: absolute; top: 150px; left: 10px; width: 380px; max-height: 70vh; overflow-y: auto; background: white; border: 1px solid #ccc; border-radius: 6px; padding: 10px; z-index: 9999; display: none;">
      <h6 style="font-size: 20px; font-weight: bold; color: #1e40af;">
        📍 Hướng dẫn đường đi</h6>
      <ul id="direction-list" style="padding-left: 18px; line-height: 1.6;"></ul>
      <button onclick="hideDirectionBox()" 
      style="margin: 12px 0 10px 8px;padding: 6px 12px;background-color: #dc2626;color: white;border: none;border-radius: 4px;font-size: 18px;cursor: pointer;display: inline-flex;align-items: center;gap: 6px;">
        🧭 Thoát chỉ đường
      </button>
    </div>
    <!-- ✅ Nút Vệ tinh -->
    <div style="position: absolute; bottom: 20px; left: 15px; z-index: 1000; background: rgb(202, 118, 118); padding: 5px 10px; border-radius: 20px; display: flex; align-items: center; gap: 8px;">
      <span style="color: rgb(17, 10, 10); margin-left: 8px;">🗺️ Vệ tinh</span>
      <label class="switch">
        <input type="checkbox" id="toggleSatellite">
        <span class="slider round"></span>
      </label>
    </div>
    <!-- ✅ kinh độ vĩ độ -->
    <div id="mouse-position" 
      style="position: absolute;bottom: 0px;right: 11%;font-size: 14px;color: #444;background: rgba(255, 255, 255, 0.6);padding: 2px 6px;border-radius: 3px;z-index: 999;font-family: sans-serif;box-shadow: 0 0 2px rgba(0,0,0,0.1);">
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
