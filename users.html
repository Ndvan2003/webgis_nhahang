<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách tài khoản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
      .statistics-fixed {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 200px;
      background: #ffffff;
      border: 2px solid #299B63;            /* ✅ VIỀN XANH TRỌN KHUNG */
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      padding: 16px 20px;
      border-radius: 16px;                   /* ✅ BO TRÒN ĐỀU CÁC GÓC */
      z-index: 2000;
      transition: box-shadow 0.3s ease;
    }

    .statistics-fixed:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .statistics-fixed h5 {
      color: #299B63;
      margin-bottom: 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .statistics-fixed h5::before {
      font-size: 18px;
    }

    .statistics-fixed ul {
      list-style: none;
      padding-left: 0;
      margin-bottom: 0;
    }

    .statistics-fixed li {
      padding: 6px 0;
      border-bottom: 1px dashed #ddd;
      font-size: 14.5px;
      color: #333;
    }

    .statistics-fixed li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success px-4">
    <a class="navbar-brand" href="index.html">Trang chủ</a>
    <ul class="navbar-nav ms-auto d-flex flex-row gap-3">
      <li class="nav-item"><a class="nav-link text-white fw-bold" href="users.html">Danh sách tài khoản</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="#" onclick="logout()">Đăng xuất</a></li>
    </ul>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Danh sách tài khoản</h3>

    <!-- Thống kê -->
    <div id="statistics" class="statistics-fixed">
      <h5>📊 Thống kê chung</h5>
      <ul id="statsList" class="mb-0"></ul>
    </div>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Tên đăng nhập</th>
          <th>Email</th>
          <th>Vai trò</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <!-- Modal sửa -->
  <div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editUserForm">
          <div class="modal-header">
            <h5 class="modal-title">Sửa người dùng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editUsername">
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" id="editEmail">
            </div>
            <div class="mb-3">
              <label>Vai trò</label>
              <select class="form-select" id="editRole">
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const role = localStorage.getItem('role');
    if (role !== 'admin') {
      alert('Bạn không có quyền truy cập trang này!');
      window.location.href = 'index.html';
    }

    let users = [];
    let visitCount = 0;

    function renderUsers() {
      const userTable = document.getElementById('userTableBody');
      userTable.innerHTML = '';
      users.forEach(u => {
        userTable.innerHTML += `
          <tr>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" onclick="editUser('${u.username}')">Sửa</button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.username}')">Xoá</button>
            </td>
          </tr>
        `;
      });
      renderStatistics();
    }

    function renderStatistics() {
      const stats = {
        total: users.length,
        admins: users.filter(u => u.role === 'admin').length,
        normalUsers: users.filter(u => u.role === 'user').length
      };

      const statsList = document.getElementById('statsList');
      statsList.innerHTML = `
        <li><strong>Tổng số tài khoản:</strong> ${stats.total}</li>
        <li><strong>Số tài khoản admin:</strong> ${stats.admins}</li>
        <li><strong>Số tài khoản user:</strong> ${stats.normalUsers}</li>
        <li><strong>Số lượt truy cập:</strong> ${visitCount}</li>
      `;
    }

    function editUser(username) {
      const user = users.find(u => u.username === username);
      if (!user) return;
      document.getElementById('editUsername').value = user.username;
      document.getElementById('editEmail').value = user.email;
      document.getElementById('editRole').value = user.role;
      const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
      modal.show();
    }

    document.getElementById('editUserForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('editUsername').value;
      const updatedUser = {
        email: document.getElementById('editEmail').value,
        role: document.getElementById('editRole').value
      };

      fetch(`http://localhost:3000/api/users/${username}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedUser)
      }).then(res => {
        if (!res.ok) throw new Error('Lỗi cập nhật');
        alert('Cập nhật thành công!');
        if (username === localStorage.getItem('username')) {
          localStorage.setItem('role', updatedUser.role);
          window.location.href = 'index.html';
        } else {
          location.reload();
        }
      }).catch(err => alert(err.message));
    });

    function deleteUser(username) {
      if (!confirm(`Xoá người dùng ${username}?`)) return;
      fetch(`http://localhost:3000/api/users/${username}`, { method: 'DELETE' })
        .then(res => {
          if (!res.ok) throw new Error('Xoá thất bại');
          users = users.filter(u => u.username !== username);
          renderUsers();
        })
        .catch(err => alert(err.message));
    }

    function incrementVisitCount() {
      fetch('http://localhost:3000/api/incrementVisit', { method: 'POST' })
        .catch(err => console.error('Không thể tăng lượt truy cập', err));
    }

    function fetchVisitCount() {
      fetch('http://localhost:3000/api/visitCount')
        .then(res => res.json())
        .then(data => {
          visitCount = data.count;
          renderStatistics();
        })
        .catch(err => console.error('Không thể lấy lượt truy cập', err));
    }

    window.onload = function () {
      incrementVisitCount();
      fetchVisitCount();
      fetch('http://localhost:3000/api/users')
        .then(res => res.json())
        .then(data => {
          users = data;
          renderUsers();
        })
        .catch(err => console.error('Lỗi tải danh sách người dùng:', err));
    };
  </script>
</body>
</html>
